name: Backup (NFR-DATA-006)

# Ежедневная независимая копия БД тестового стенда (дополнительно к PITR Neon).
# Работает только при заданных секретах репозитория BACKUP_DATABASE_URL и BACKUP_PASSPHRASE;
# дамп шифруется (AES-256) до загрузки в артефакт, хранится 7 дней.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Секреты BACKUP_DATABASE_URL / BACKUP_PASSPHRASE не заданы — резервное копирование пропущено"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dump and encrypt
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          pg_dump --format=custom --no-owner --no-privileges --file backup.dump "$BACKUP_DATABASE_URL"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup.dump -out backup.dump.enc -pass env:BACKUP_PASSPHRASE
          rm backup.dump
          ls -l backup.dump.enc
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: artchronos-backup-${{ github.run_id }}
          path: backup.dump.enc
          retention-days: 7
